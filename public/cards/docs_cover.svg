<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGradDocs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110e" />
      <stop offset="50%" stop-color="#1e1812" />
      <stop offset="100%" stop-color="#0e0c0a" />
    </linearGradient>
    <radialGradient id="glowDocs" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9500" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#ff9500" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#ff9500" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGradDocs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <filter id="shadowDocs" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#ff9500" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGradDocs)" />

  <!-- Ambient Glow -->
  <circle cx="600" cy="337" r="380" fill="url(#glowDocs)" />

  <!-- Minimal Frame -->
  <rect x="120" y="80" width="960" height="515" rx="28" fill="none" stroke="#ff9500" stroke-opacity="0.22" stroke-width="1.5" />
  
  <line x1="600" y1="80" x2="600" y2="120" stroke="#ff9500" stroke-opacity="0.35" stroke-width="1" />
  <line x1="600" y1="555" x2="600" y2="595" stroke="#ff9500" stroke-opacity="0.35" stroke-width="1" />

  <!-- Pill Badge -->
  <g transform="translate(600, 210)">
    <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#ff9500" fill-opacity="0.14" stroke="#ff9500" stroke-opacity="0.4" stroke-width="1" />
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="2.5" fill="#fed7aa">PILLAR 04</text>
  </g>

  <!-- Centered Title -->
  <text x="600" y="365" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="108" font-weight="800" letter-spacing="-2" fill="url(#textGradDocs)" filter="url(#shadowDocs)">DOCS</text>

  <!-- Center Aligned Subtitle -->
  <text x="600" y="430" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="18" font-weight="500" letter-spacing="4" fill="#fdba74">PRD &amp; SPECIFICATIONS</text>
</svg>
