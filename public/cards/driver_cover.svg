<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a140e" />
      <stop offset="50%" stop-color="#102016" />
      <stop offset="100%" stop-color="#07100a" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#10b981" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <!-- Ambient Glow -->
  <circle cx="600" cy="337" r="380" fill="url(#glow)" />

  <!-- Subtle Minimal Frame -->
  <rect x="120" y="80" width="960" height="515" rx="28" fill="none" stroke="#10b981" stroke-opacity="0.18" stroke-width="1.5" />
  
  <!-- Subtle Grid Accent Lines -->
  <line x1="600" y1="80" x2="600" y2="120" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />
  <line x1="600" y1="555" x2="600" y2="595" stroke="#10b981" stroke-opacity="0.3" stroke-width="1" />

  <!-- Pill Badge -->
  <g transform="translate(600, 210)">
    <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-opacity="0.35" stroke-width="1" />
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="2.5" fill="#6ee7b7">PILLAR 03</text>
  </g>

  <!-- Centered Title -->
  <text x="600" y="365" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="108" font-weight="800" letter-spacing="-2" fill="url(#textGrad)" filter="url(#shadow)">DRIVER</text>

  <!-- Center Aligned Subtitle -->
  <text x="600" y="430" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="18" font-weight="500" letter-spacing="4" fill="#94a3b8">MOBILE &amp; DISPATCH APP</text>
</svg>
