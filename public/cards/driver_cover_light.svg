<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgLightGradDriver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fbf8" />
      <stop offset="100%" stop-color="#f0f7f1" />
    </linearGradient>
    <radialGradient id="lightGlowDriver" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#248a3d" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#248a3d" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#248a3d" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGradLightDriver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d1d1f" />
      <stop offset="100%" stop-color="#3a3a3c" />
    </linearGradient>
    <filter id="appleShadowDriver" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean Apple Satin Background -->
  <rect width="1200" height="675" fill="url(#bgLightGradDriver)" />

  <!-- Soft Ambient Accent Glow -->
  <circle cx="600" cy="337" r="420" fill="url(#lightGlowDriver)" />

  <!-- Hairline Apple Inset Frame -->
  <rect x="120" y="80" width="960" height="515" rx="28" fill="none" stroke="#248a3d" stroke-opacity="0.18" stroke-width="1.5" />
  
  <line x1="600" y1="80" x2="600" y2="120" stroke="#248a3d" stroke-opacity="0.25" stroke-width="1" />
  <line x1="600" y1="555" x2="600" y2="595" stroke="#248a3d" stroke-opacity="0.25" stroke-width="1" />

  <!-- Refined Apple Pill Badge -->
  <g transform="translate(600, 210)">
    <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#248a3d" fill-opacity="0.08" stroke="#248a3d" stroke-opacity="0.24" stroke-width="1" />
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="2.5" fill="#248a3d">PILLAR 03</text>
  </g>

  <!-- Crisp Apple Center Title -->
  <text x="600" y="365" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="108" font-weight="800" letter-spacing="-2" fill="url(#textGradLightDriver)" filter="url(#appleShadowDriver)">DRIVER</text>

  <!-- Clean Subtitle -->
  <text x="600" y="430" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="18" font-weight="600" letter-spacing="4" fill="#6e6e73">MOBILE &amp; DISPATCH APP</text>
</svg>
