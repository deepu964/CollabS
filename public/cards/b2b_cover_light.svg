<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8f9fa" />
      <stop offset="100%" stop-color="#f1f3f5" />
    </linearGradient>
    <radialGradient id="lightGlowB2B" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5856d6" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#5856d6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#5856d6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d1d1f" />
      <stop offset="100%" stop-color="#3a3a3c" />
    </linearGradient>
    <filter id="appleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Clean Apple Satin Background -->
  <rect width="1200" height="675" fill="url(#bgLightGrad)" />

  <!-- Soft Ambient Accent Glow -->
  <circle cx="600" cy="337" r="420" fill="url(#lightGlowB2B)" />

  <!-- Hairline Apple Inset Frame -->
  <rect x="120" y="80" width="960" height="515" rx="28" fill="none" stroke="#5856d6" stroke-opacity="0.18" stroke-width="1.5" />
  
  <line x1="600" y1="80" x2="600" y2="120" stroke="#5856d6" stroke-opacity="0.25" stroke-width="1" />
  <line x1="600" y1="555" x2="600" y2="595" stroke="#5856d6" stroke-opacity="0.25" stroke-width="1" />

  <!-- Refined Apple Pill Badge -->
  <g transform="translate(600, 210)">
    <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#5856d6" fill-opacity="0.08" stroke="#5856d6" stroke-opacity="0.24" stroke-width="1" />
    <text x="0" y="6" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="2.5" fill="#5856d6">PILLAR 01</text>
  </g>

  <!-- Crisp Apple Center Title -->
  <text x="600" y="365" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="108" font-weight="800" letter-spacing="-2" fill="url(#textGradLight)" filter="url(#appleShadow)">B2B</text>

  <!-- Clean Subtitle -->
  <text x="600" y="430" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="18" font-weight="600" letter-spacing="4" fill="#6e6e73">ENTERPRISE &amp; WHOLESALE</text>
</svg>
